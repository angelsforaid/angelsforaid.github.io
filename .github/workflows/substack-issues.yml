# Keeps the homepage's "latest issues" in step with Substack.
# Runs every 6 hours; to run it right away, open Actions → "Update newsletter issues" → Run workflow.
name: Update newsletter issues
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-issues.js
      - name: Save if anything changed
        run: |
          git add issues.json
          if git diff --cached --quiet; then echo "No new issues."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update newsletter issues from Substack"
          git push
